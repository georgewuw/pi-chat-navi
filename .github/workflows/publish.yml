name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # trusted publishing 需要 npm >= 11.5.1；显式升级避免 Node 自带版本过旧
      - name: Ensure npm supports OIDC
        run: |
          npm install --global npm@latest
          npm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm run check

      # 使用 npm publish（不是 pnpm publish），由 npm CLI 完成 OIDC token 交换。
      # 不再需要 NPM_TOKEN；prepublishOnly 会再跑一次 typecheck + 测试。
      - run: npm publish
